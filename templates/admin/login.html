{% extends "base.html" %}
{% block title %}Sign in | {{ brand.name }}{% endblock %}
{% block content %}
<div class="login-box">
  <h1 style="font-size:2rem">Admin sign in</h1>
  <p class="muted">Sign in to publish news, white papers and reports, and to change the site's branding and theme.</p>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="adm-form" style="gap:14px">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" autofocus required></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
