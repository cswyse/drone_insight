{% extends "base.html" %}
{% block title %}Sign in | {{ brand.name }}{% endblock %}
{% block content %}
<div class="auth-box">
  <h1 style="font-size:2rem">Sign in</h1>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="form-grid">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="small muted" style="margin-top:18px">New here? <a href="{{ url_for('signup', next=next) }}">Create a free account</a><br>
  Forgot your password? <a href="{{ url_for('contact', subject='Password reset') }}">Contact us</a> and we will set a temporary one.</p>
</div>
{% endblock %}
